<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Canvas Lite</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --fg:#e6e9ef; --muted:#8b93a7; --accent:#4f8cff; --accent2:#2ecc71;
    --danger:#ff5c5c; --code:#0b0d11;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
  body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  header{display:flex;align-items:center;gap:8px;padding:8px 10px;
    background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header input.name{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:6px 10px;font-size:14px;min-width:120px;flex:1}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
  .btn:active{transform:scale(.96)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.good{background:var(--accent2);border-color:var(--accent2);color:#04210f}
  .btn.warn{background:transparent;border-color:var(--danger);color:var(--danger)}
  .tabs{display:flex;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
  .tab{flex:1;text-align:center;padding:8px;border-radius:8px;background:var(--panel2);
    border:1px solid var(--line);font-size:13px;color:var(--muted)}
  .tab.active{color:#fff;border-color:var(--accent);background:#20304f}
  main{flex:1;display:flex;min-height:0}
  .pane{flex:1;min-width:0;display:none;flex-direction:column;overflow:hidden}
  .pane.show{display:flex}
  @media(min-width:820px){
    .tabs{display:none}
    .pane{display:flex !important;border-right:1px solid var(--line)}
    .pane:last-child{border-right:none}
  }
  textarea{flex:1;width:100%;resize:none;border:none;outline:none;padding:14px;
    background:var(--code);color:var(--fg);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:14px;line-height:1.6;tab-size:2}
  .preview{flex:1;overflow:auto;padding:16px 18px;line-height:1.7;font-size:15px}
  .preview h1{font-size:1.6em;border-bottom:1px solid var(--line);padding-bottom:.3em;margin:.6em 0 .4em}
  .preview h2{font-size:1.35em;border-bottom:1px solid var(--line);padding-bottom:.25em;margin:.9em 0 .4em}
  .preview h3{font-size:1.15em;margin:.8em 0 .3em}
  .preview h4{font-size:1em;margin:.7em 0 .3em;color:var(--muted)}
  .preview p{margin:.5em 0}
  .preview code{background:var(--panel2);padding:2px 6px;border-radius:5px;
    font-family:ui-monospace,monospace;font-size:.9em}
  .preview pre{background:var(--code);border:1px solid var(--line);border-radius:10px;
    padding:12px;overflow:auto}
  .preview pre code{background:none;padding:0}
  .preview blockquote{border-left:3px solid var(--accent);margin:.6em 0;padding:.2em 12px;
    color:var(--muted);background:var(--panel);border-radius:0 8px 8px 0}
  .preview ul,.preview ol{padding-left:1.4em;margin:.5em 0}
  .preview li{margin:.25em 0}
  .preview a{color:var(--accent);text-decoration:none}
  .preview hr{border:none;border-top:1px solid var(--line);margin:1.2em 0}
  .preview table{border-collapse:collapse;width:100%;margin:.6em 0;font-size:.92em}
  .preview th,.preview td{border:1px solid var(--line);padding:6px 10px;text-align:left}
  .preview th{background:var(--panel2)}
  .preview img{max-width:100%;border-radius:8px}
  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:50}
  .drawer.show{display:block}
  .drawer .sheet{position:absolute;left:0;right:0;bottom:0;max-height:70%;overflow:auto;
    background:var(--panel);border-radius:16px 16px 0 0;padding:14px}
  .drawer h3{margin:.2em 0 .6em;font-size:15px}
  .snap{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);
    border-radius:10px;margin-bottom:8px;background:var(--panel2)}
  .snap .meta{flex:1;min-width:0}
  .snap .t{font-size:13px}
  .snap .d{font-size:11px;color:var(--muted)}
  .statusbar{display:flex;gap:14px;padding:5px 12px;background:var(--panel);
    border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);
    background:#000;border:1px solid var(--line);color:#fff;padding:8px 16px;border-radius:20px;
    font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
  .toast.show{opacity:.95}
  /* 文档库 */
  .library{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:70}
  .library.show{display:block}
  .libpanel{height:100%;width:min(92vw,430px);background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;box-shadow:8px 0 30px rgba(0,0,0,.35)}
  .libhead{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
  .libhead h2{font-size:17px;margin:0;flex:1}
  .libactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px}
  .libsearch{padding:0 12px 10px}
  .libsearch input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:10px;padding:10px 12px;font-size:14px;outline:none}
  .libsearch input:focus{border-color:var(--accent)}
  .doclist{flex:1;overflow:auto;padding:0 10px 14px}
  .docitem{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);
    border-radius:10px;margin-bottom:7px;background:var(--panel2);cursor:pointer}
  .docitem.active{border-color:var(--accent);background:#20304f}
  .docmeta{flex:1;min-width:0}
  .doctitle{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .docsub{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .docdel{border:none;background:transparent;color:var(--muted);font-size:18px;padding:6px}
  .docdel:active{color:var(--danger)}
  .empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:13px}
  .libfoot{padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
    color:var(--muted);font-size:11px}
  /* 直播预览 */
  .livebar{display:none;align-items:center;gap:10px;padding:8px 12px;background:#10241a;
    border-bottom:1px solid #1f4d33;font-size:13px}
  .livebar.show{display:flex}
  .livedot{width:10px;height:10px;border-radius:50%;background:var(--accent2);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .livebar .lvinfo{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
  .livebar .lvtime{color:var(--muted);font-size:11px;white-space:nowrap}
  .liveview{display:none;position:fixed;inset:0;z-index:40;background:var(--bg);flex-direction:column}
  .liveview.show{display:flex}
  .lvhead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);
    border-bottom:1px solid var(--line);font-size:14px}
  .lvhead .lvfile{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .livepreview{flex:1;overflow:auto;padding:16px 18px;line-height:1.7;font-size:15px}
  .livepreview pre.coderaw{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;font-family:ui-monospace,monospace;font-size:13px;white-space:pre}
  /* 导出菜单 */
  .menu{position:fixed;left:10px;right:10px;bottom:0;background:var(--panel);
    border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:none;
    padding:10px 12px calc(14px + env(safe-area-inset-bottom));z-index:60;
    transform:translateY(110%);transition:transform .25s}
  .menu.show{transform:translateY(0)}
  .menu h3{margin:.2em 0 .5em;font-size:14px}
  .menu .mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:10px;padding:12px;margin-bottom:8px;font-size:14px}
  .menu .mi:active{transform:scale(.98)}
  .menu .mi .d{flex:1}
  .menu .mi .sub{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  /* 打印/PDF */
  @media print{
    header,.tabs,.statusbar,.drawer,.menu,.toast{display:none !important}
    body{background:#fff;color:#000;height:auto;overflow:visible}
    main{display:block}
    .pane{display:none !important}
    .pane.show,.pane[data-pane=prev]{display:block !important}
    .preview{color:#000;font-size:12pt;padding:0;overflow:visible}
    .preview h1,.preview h2{color:#000;border-color:#999}
    .preview blockquote{color:#333;border-color:#666;background:#f5f5f5}
    .preview code{background:#f0f0f0;color:#333}
    .preview pre{background:#f7f7f7;border:1px solid #ccc;color:#111}
    .preview a{color:#00c}
    .preview th{background:#eee}
    .preview th,.preview td{border-color:#999;color:#111}
    .preview li,.preview p{color:#111}
  }
  @page{margin:14mm}
</style>
</head>
<body>
<header>
  <button class="btn primary" id="btnLibrary">文档</button>
  <input class="name" id="fname" value="untitled.md" spellcheck="false">
  <button class="btn good" id="btnSnap">存快照</button>
  <button class="btn" id="btnHist">历史</button>
  <button class="btn" id="btnExport">导出</button>
  <button class="btn" id="btnCopy">复制</button>
</header>
<div class="tabs">
  <div class="tab active" data-p="edit">编辑</div>
  <div class="tab" data-p="prev">预览</div>
</div>
<main>
  <div class="pane show" data-pane="edit">
    <textarea id="ed" placeholder="在这里写 Markdown..." spellcheck="false"></textarea>
  </div>
  <div class="pane" data-pane="prev">

<div class="statusbar">

<div class="library" id="library">

    <div class="libactions">
      <button class="btn primary" id="newDoc">＋ 新建文档</button>
      <button class="btn" id="importDoc">↑ 导入文件</button>
      <input type="file" id="filePicker" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple hidden>
    </div>
    <div class="libsearch"><input id="docSearch" type="search" placeholder="搜索标题或正文…" autocomplete="off"></div>
    <div class="doclist" id="docList"></div>
    <div class="libfoot" id="docCount">0 个文档 · 数据保存在本机浏览器</div>
  </section>
</div>

<div class="library" id="library">
  <section class="libpanel" role="dialog" aria-label="文档库">
    <div class="libhead"><h2>文档库</h2><button class="btn" id="closeLibrary">关闭</button></div>
    <div class="libactions">
      <button class="btn primary" id="newDoc">＋ 新建文档</button>
      <button class="btn" id="importDoc">↑ 导入文件</button>
      <input type="file" id="filePicker" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple hidden>
    </div>
    <div class="libsearch"><input id="docSearch" type="search" placeholder="搜索标题或正文…" autocomplete="off"></div>
    <div class="doclist" id="docList"></div>

</div>

<div class="drawer" id="drawer">
  <div class="sheet">
    <h3>版本快照 <button class="btn warn" id="btnClearSnap" style="float:right">清空</button></h3>

</div>
<div class="livebar" id="liveBar">

</div>

  <div class="lvhead">
    <span class="lvfile" id="lvFileName">直播预览</span>

    <button class="btn" id="btnLiveMin">收起</button>

  </div>
  <div class="livepreview" id="livePreview"></div>
</div>

<div class="toast" id="toast"></div>

<div class="menu" id="exportMenu">
  <h3>导出为</h3>
  <button class="mi" data-fmt="md"><span class="d">Markdown 文件<span class="sub">.md 纯文本，编辑器通用</span></span>›</button>
  <button class="mi" data-fmt="docx"><span class="d">Word 文档<span class="sub">.docx，WPS/Office 可直接打开</span></span>›</button>

  <button class="mi warn" id="cancelExport">取消</button>

<script>
/* ---------- 迷你 Markdown 解析器（零依赖，够用即可） ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(s){
  // 转义已由块级处理时完成；这里只处理行内
  s=s.replace(/`([^`]+)`/g,(m,c)=>'<code>'+c+'</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function mdToHtml(md){
  const lines=md.replace(/\r\n?/g,'\n').split('\n');
  let html='',i=0;
  const flushInline=t=>inline(esc(t));
  while(i<lines.length){
    let ln=lines[i];
    // 代码块
    if(/^```/.test(ln)){
      const lang=ln.slice(3).trim(); let buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])){buf.push(lines[i]);i++}
      i++; html+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>'; continue;
    }
    // 水平线
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)){html+='<hr>';i++;continue;}
    // 标题
    let h=ln.match(/^(#{1,6})\s+(.*)$/);
    if(h){const n=h[1].length;html+='<h'+n+'>'+flushInline(h[2])+'</h'+n+'>';i++;continue;}
    // 引用
    if(/^>\s?/.test(ln)){
      let buf=[];
      while(i<lines.length && /^>\s?/.test(lines[i])){buf.push(lines[i].replace(/^>\s?/,''));i++}
      html+='<blockquote>'+mdToHtml(buf.join('\n'))+'</blockquote>';continue;
    }
    // 表格
    if(/\|/.test(ln) && i+1<lines.length && /^\s*\|?[\s:-]+\|[\s:|-]*$/.test(lines[i+1])){
      const head=ln.split('|').map(s=>s.trim()).filter((s,idx,a)=>!(idx===0&&s==='')&&!(idx===a.length-1&&s===''));
      i+=2; let rows=[];
      while(i<lines.length && /\|/.test(lines[i]) && lines[i].trim()!==''){
        rows.push(lines[i].split('|').map(s=>s.trim()).filter((s,idx,a)=>!(idx===0&&s==='')&&!(idx===a.length-1&&s==='')));i++;
      }
      let t='<table><thead><tr>'+head.map(c=>'<th>'+flushInline(c)+'</th>').join('')+'</tr></thead><tbody>';
      rows.forEach(r=>{t+='<tr>'+r.map(c=>'<td>'+flushInline(c)+'</td>').join('')+'</tr>'});
      html+=t+'</tbody></table>';continue;
    }
    // 无序列表
    if(/^\s*[-*+]\s+/.test(ln)){
      let buf=[];
      while(i<lines.length && /^\s*[-*+]\s+/.test(lines[i])){buf.push(lines[i].replace(/^\s*[-*+]\s+/,''));i++}
      html+='<ul>'+buf.map(x=>'<li>'+flushInline(x)+'</li>').join('')+'</ul>';continue;
    }
    // 有序列表
    if(/^\s*\d+\.\s+/.test(ln)){
      let buf=[];
      while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){buf.push(lines[i].replace(/^\s*\d+\.\s+/,''));i++}
      html+='<ol>'+buf.map(x=>'<li>'+flushInline(x)+'</li>').join('')+'</ol>';continue;
    }
    // 空行
    if(/^\s*$/.test(ln)){i++;continue;}
    // 普通段落（合并连续非空行）
    let buf=[ln];i++;
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6}\s|>|```|\s*[-*+]\s|\s*\d+\.\s)/.test(lines[i])){buf.push(lines[i]);i++}
    html+='<p>'+flushInline(buf.join(' '))+'</p>';
  }
  return html;
}

/* ---------- DOCX 生成器（零依赖：手写 ZIP + Word XML） ---------- */
// CRC32 表
const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(buf){let c=0xFFFFFFFF;for(let i=0;i<buf.length;i++)c=CRC_TABLE[(c^buf[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function dosTime(){const d=new Date();return ((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF}
function dosDate(){const d=new Date();return (((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF}
function zipStore(files){ // files: [{name, data(TextEncoder array)}]
  const enc=new TextEncoder();let local=[],central=[],offset=0;
  files.forEach(f=>{
    const name=enc.encode(f.name),data=f.data;
    const lh=new Uint8Array(30+name.length+data.length);
    const dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);       // signature
    dv.setUint16(4,20,true);               // version needed
    dv.setUint16(6,0,true);                // flags
    dv.setUint16(8,0,true);                // method: store
    dv.setUint16(10,dosTime(),true);       // mod time
    dv.setUint16(12,dosDate(),true);       // mod date
    dv.setUint32(14,crc32(data),true);     // crc32
    dv.setUint32(18,data.length,true);     // compressed size
    dv.setUint32(22,data.length,true);     // uncompressed size
    dv.setUint16(26,name.length,true);     // name length
    dv.setUint16(28,0,true);               // extra length
    lh.set(name,30);lh.set(data,30+name.length);
    local.push(lh);central.push({name,data,offset});offset+=lh.length;
  });
  const cdStart=offset;let cd=[];
  central.forEach(f=>{
    const name=f.name;const ch=new Uint8Array(46+name.length);
    const dv=new DataView(ch.buffer);
    dv.setUint32(0,0x02014b50,true);       // signature
    dv.setUint16(4,20,true);               // version made by
    dv.setUint16(6,20,true);               // version needed
    dv.setUint16(8,0,true);                // flags
    dv.setUint16(10,0,true);               // method: store
    dv.setUint16(12,dosTime(),true);       // mod time
    dv.setUint16(14,dosDate(),true);       // mod date
    dv.setUint32(16,crc32(f.data),true);   // crc32
    dv.setUint32(20,f.data.length,true);   // compressed size
    dv.setUint32(24,f.data.length,true);   // uncompressed size
    dv.setUint16(28,name.length,true);     // name length
    dv.setUint16(30,0,true);               // extra length
    dv.setUint16(32,0,true);               // comment length
    dv.setUint16(34,0,true);               // disk start
    dv.setUint16(36,0,true);               // internal attrs
    dv.setUint32(38,0,true);               // external attrs
    dv.setUint32(42,f.offset,true);        // local header offset
    ch.set(name,46);cd.push(ch);
  });
  const cdLen=cd.reduce((s,c)=>s+c.length,0);
  const eocd=new Uint8Array(22);const edv=new DataView(eocd.buffer);
  edv.setUint32(0,0x06054b50,true);edv.setUint16(8,central.length,true);edv.setUint16(10,central.length,true);
  edv.setUint32(12,cdLen,true);edv.setUint32(16,cdStart,true);
  const total=local.reduce((s,c)=>s+c.length,0)+cdLen+eocd.length;
  const out=new Uint8Array(total);let p=0;
  local.forEach(c=>{out.set(c,p);p+=c.length});
  cd.forEach(c=>{out.set(c,p);p+=c.length});
  out.set(eocd,p);
  return out;
}
function escXml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function mdToDocx(md){
  const lines=md.replace(/\r\n?/g,'\n').split('\n');
  let body='',inCode=false,codeBuf=[];
  const para=(txt,bold,sz)=>`<w:p><w:pPr><w:jc w:val="left"/></w:pPr><w:r><w:rPr>${bold?'<w:b/>':''}${sz?`<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/>`:''}</w:rPr><w:t xml:space="preserve">${escXml(txt)}</w:t></w:r></w:p>`;
  for(let i=0;i<lines.length;i++){
    const ln=lines[i];
    if(/^```/.test(ln)){if(inCode){body+='<w:p><w:pPr><w:pStyle w:val="Code"/></w:pPr><w:r><w:t xml:space="preserve">'+escXml(codeBuf.join('\n'))+'</w:t></w:r></w:p>';codeBuf=[];inCode=false}else{inCode=true}continue}
    if(inCode){codeBuf.push(ln);continue}
    if(/^\s*$/.test(ln))continue;
    let h=ln.match(/^(#{1,6})\s+(.*)$/);
    if(h){const n=h[1].length;const sz=n===1?36:n===2?32:n===3?28:24;body+=para(h[2],true,sz);continue}
    if(/^>\s?/.test(ln)){body+=para('▎'+ln.replace(/^>\s?/,''),false,22);continue}
    if(/^\s*[-*+]\s+/.test(ln)){body+=para('• '+ln.replace(/^\s*[-*+]\s+/,''),false,24);continue}
    if(/^\s*\d+\.\s+/.test(ln)){body+=para(ln.replace(/^\s*(\d+\.)\s+/,'$1 '),false,24);continue}
    if(/^\s*\|/.test(ln)){ // 表格转文本
      const cells=ln.split('|').map(s=>s.trim()).filter(s=>s&&!/^[-:]+$/.test(s));
      if(cells.length)body+=para(cells.join(' | '),true,22);continue;
    }
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)){body+=para('─'.repeat(12),false,22);continue}
    body+=para(ln.replace(/\*\*([^*]+)\*\*/g,'$1'),false,24);
  }
  const docXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr/></w:body></w:document>`;
  const ctXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;
  const relXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const enc=new TextEncoder();
  return zipStore([
    {name:'[Content_Types].xml',data:enc.encode(ctXml)},
    {name:'_rels/.rels',data:enc.encode(relXml)},
    {name:'word/document.xml',data:enc.encode(docXml)}
  ]);
}

/* ---------- P3 文档库：IndexedDB 多文档 + 导入 + 搜索 ---------- */
const ed=document.getElementById('ed'), pv=document.getElementById('pv'),
      fname=document.getElementById('fname'), toast=document.getElementById('toast');
const LSKEY='canvasLite:draft', LSNAME='canvasLite:name', LSSNAP='canvasLite:snaps';
const DB_NAME='canvasLiteDB', DB_VERSION=1, STORE='documents';
const CURRENT_KEY='canvasLite:currentDocId', MIGRATED_KEY='canvasLite:p3Migrated';
let db=null, currentDoc=null, saveTimer=null;

function render(){pv.innerHTML=mdToHtml(ed.value);updateStat();}
function updateStat(){
  const t=ed.value;
  document.getElementById('stat-words').textContent=t.replace(/\s/g,'').length+' 字';
  document.getElementById('stat-lines').textContent=t.split('\n').length+' 行';
}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');
  clearTimeout(showToast._t);showToast._t=setTimeout(()=>toast.classList.remove('show'),1800);}
function defaultContent(){return '# 我的第一篇 Canvas\n\n开始写点什么吧。\n\n- 左边编辑，右边预览\n- 顶部「存快照」保存版本\n- 「文档」管理、导入和搜索\n\n> 全部数据只存在你的浏览器本地。\n'}
function cleanName(name){return (name||'untitled.md').trim().replace(/[\\/:*?"<>|]/g,'_')||'untitled.md'}
function newId(){return (crypto&&crypto.randomUUID)?crypto.randomUUID():'doc-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
function openDb(){return new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB_NAME,DB_VERSION);
  req.onupgradeneeded=()=>{
    const s=req.result.createObjectStore(STORE,{keyPath:'id'});
    s.createIndex('updatedAt','updatedAt');
  };
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error);
});}
function reqAsPromise(req){return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function store(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
async function getDoc(id){return reqAsPromise(store().get(id))}
async function getAllDocs(){const a=await reqAsPromise(store().getAll());return a.sort((x,y)=>y.updatedAt-x.updatedAt)}
async function putDoc(doc){await reqAsPromise(store('readwrite').put(doc));return doc}
async function removeDoc(id){await reqAsPromise(store('readwrite').delete(id))}
async function docCount(){return reqAsPromise(store().count())}

async function migrateLegacy(){
  if(localStorage.getItem(MIGRATED_KEY))return;
  const oldDraft=localStorage.getItem(LSKEY), oldName=localStorage.getItem(LSNAME);
  const docs=await getAllDocs();
  if(!docs.length){
    const first={id:newId(),name:cleanName(oldName||'untitled.md'),content:oldDraft!==null?oldDraft:defaultContent(),createdAt:Date.now(),updatedAt:Date.now()};
    await putDoc(first);
    // 旧版全局快照只迁移到第一份文档，绝不丢弃原始数据。
    try{const oldSnaps=JSON.parse(localStorage.getItem(LSSNAP)||'[]');if(oldSnaps.length)localStorage.setItem('canvasLite:snaps:'+first.id,JSON.stringify(oldSnaps))}catch(e){}
  }
  localStorage.setItem(MIGRATED_KEY,'1');
}
function setSaved(text){document.getElementById('stat-saved').textContent=text}
function applyDoc(doc){
  currentDoc={...doc};
  localStorage.setItem(CURRENT_KEY,doc.id);
  fname.value=doc.name;ed.value=doc.content||'';render();
  setSaved('已打开 '+new Date(doc.updatedAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));
}
async function saveCurrent(){
  if(!currentDoc)return;
  const now=Date.now();
  currentDoc={...currentDoc,name:cleanName(fname.value),content:ed.value,updatedAt:now};
  fname.value=currentDoc.name;
  await putDoc(currentDoc);
  // 留存旧键兼容 P1 数据；真正数据源已切至 IndexedDB。
  localStorage.setItem(LSKEY,ed.value);localStorage.setItem(LSNAME,currentDoc.name);
  setSaved('已保存 '+new Date(now).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));
  renderDocList(document.getElementById('docSearch').value);
}
function scheduleSave(){
  clearTimeout(saveTimer);setSaved('正在保存…');
  saveTimer=setTimeout(()=>saveCurrent().catch(e=>showToast('保存失败：'+e.message)),450);
}
async function flushSave(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null}await saveCurrent()}

/* 文档库 */
const library=document.getElementById('library'), docList=document.getElementById('docList'), docSearch=document.getElementById('docSearch');
function fmtTime(t){return new Date(t).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
async function renderDocList(query=''){
  if(!db)return;
  const all=await getAllDocs(),q=query.trim().toLowerCase();
  const docs=q?all.filter(d=>(d.name+'\n'+d.content).toLowerCase().includes(q)):all;
  docList.innerHTML='';
  if(!docs.length){docList.innerHTML='<div class="empty">没有匹配的文档</div>'}
  docs.forEach(d=>{
    const item=document.createElement('div');item.className='docitem'+(currentDoc&&d.id===currentDoc.id?' active':'');
    const meta=document.createElement('div');meta.className='docmeta';
    const title=document.createElement('div');title.className='doctitle';title.textContent=d.name;
    const sub=document.createElement('div');sub.className='docsub';sub.textContent=fmtTime(d.updatedAt)+' · '+(d.content||'').replace(/\s+/g,' ').slice(0,48);
    meta.append(title,sub);
    const del=document.createElement('button');del.className='docdel';del.title='删除文档';del.textContent='×';
    del.onclick=async e=>{e.stopPropagation();await deleteDocument(d)};
    item.onclick=async()=>{await openDocument(d.id);library.classList.remove('show')};
    item.append(meta,del);docList.appendChild(item);
  });
  document.getElementById('docCount').textContent=(q?docs.length+'/'+all.length:all.length)+' 个文档 · 数据保存在本机浏览器';
}
async function openDocument(id){
  if(currentDoc&&id===currentDoc.id)return;
  await flushSave();const doc=await getDoc(id);if(doc)applyDoc(doc);await renderDocList(docSearch.value);
}
async function createDocument(name,content=''){
  await flushSave();
  const now=Date.now(),doc={id:newId(),name:cleanName(name),content,createdAt:now,updatedAt:now};
  await putDoc(doc);applyDoc(doc);await renderDocList(docSearch.value);return doc;
}
async function deleteDocument(doc){
  if(!confirm('删除“'+doc.name+'”？此操作不可从浏览器内恢复。'))return;
  const wasCurrent=currentDoc&&doc.id===currentDoc.id;
  await removeDoc(doc.id);localStorage.removeItem('canvasLite:snaps:'+doc.id);
  if(wasCurrent){
    const rest=await getAllDocs();
    if(rest.length)applyDoc(rest[0]);else await createDocument('untitled.md',defaultContent());
  }
  await renderDocList(docSearch.value);showToast('已删除 '+doc.name);
}
async function importFiles(files){
  if(!files||!files.length)return;
  await flushSave();let last=null,ok=0;
  for(const f of files){
    if(f.size>5*1024*1024){showToast('跳过超过 5MB 的文件：'+f.name);continue}
    const content=await f.text();last=await createDocument(f.name||'imported.md',content);ok++;
  }
  if(last){applyDoc(last);await renderDocList(docSearch.value);showToast('已导入 '+ok+' 个文档')}
}

/* 快照：按当前文档隔离 */
function snapKey(){return 'canvasLite:snaps:'+(currentDoc?currentDoc.id:'none')}
function getSnaps(){try{return JSON.parse(localStorage.getItem(snapKey())||'[]')}catch(e){return[]}}
function setSnaps(a){localStorage.setItem(snapKey(),JSON.stringify(a))}
function saveSnap(){
  const a=getSnaps();a.unshift({t:Date.now(),name:fname.value,content:ed.value});
  if(a.length>50)a.length=50;setSnaps(a);showToast('已存快照 ('+a.length+')');
}
function renderSnaps(){
  const a=getSnaps(),box=document.getElementById('snapList');
  if(!a.length){box.innerHTML='<p style="color:var(--muted);font-size:13px">当前文档还没有快照</p>';return;}
  box.innerHTML='';a.forEach((s,idx)=>{
    const d=new Date(s.t),div=document.createElement('div');div.className='snap';
    const meta=document.createElement('div');meta.className='meta';
    const t=document.createElement('div');t.className='t';t.textContent=s.name||'untitled';
    const detail=document.createElement('div');detail.className='d';detail.textContent=d.toLocaleString('zh-CN')+' · '+(s.content||'').replace(/\n/g,' ').slice(0,40)+'…';
    meta.append(t,detail);
    const rb=document.createElement('button');rb.className='btn primary';rb.textContent='恢复';
    rb.onclick=async()=>{ed.value=s.content;fname.value=s.name||fname.value;render();await flushSave();document.getElementById('drawer').classList.remove('show');showToast('已恢复该快照');};
    const dbtn=document.createElement('button');dbtn.className='btn warn';dbtn.textContent='删';
    dbtn.onclick=()=>{const arr=getSnaps();arr.splice(idx,1);setSnaps(arr);renderSnaps();};
    div.append(meta,rb,dbtn);box.appendChild(div);
  });
}

/* 事件 */
ed.addEventListener('input',()=>{render();scheduleSave();});
fname.addEventListener('input',scheduleSave);
document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');
  const p=tab.dataset.p;document.querySelector('[data-pane=edit]').classList.toggle('show',p==='edit');
  document.querySelector('[data-pane=prev]').classList.toggle('show',p==='prev');if(p==='prev')render();
});
document.getElementById('btnLibrary').onclick=()=>{renderDocList(docSearch.value);library.classList.add('show');docSearch.focus()};
document.getElementById('closeLibrary').onclick=()=>library.classList.remove('show');
library.onclick=e=>{if(e.target===library)library.classList.remove('show')};
document.getElementById('newDoc').onclick=async()=>{const name=prompt('新文档名称','untitled.md');if(name!==null){await createDocument(name,'# '+cleanName(name).replace(/\.md$/i,'')+'\n\n');library.classList.remove('show');showToast('已新建文档')}};
document.getElementById('importDoc').onclick=()=>document.getElementById('filePicker').click();
document.getElementById('filePicker').onchange=async e=>{try{await importFiles([...e.target.files])}catch(err){showToast('导入失败：'+err.message)}e.target.value=''};
docSearch.oninput=()=>renderDocList(docSearch.value);
document.getElementById('btnSnap').onclick=saveSnap;
document.getElementById('btnHist').onclick=()=>{renderSnaps();document.getElementById('drawer').classList.add('show');};
document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')e.currentTarget.classList.remove('show');};
document.getElementById('btnClearSnap').onclick=()=>{if(confirm('清空当前文档的全部快照?')){setSnaps([]);renderSnaps();}};

/* 直播预览：轮询 GitHub raw，实时显示 AI 工作成果 */
const liveBar=document.getElementById('liveBar'), liveInfo=document.getElementById('liveInfo'),
      liveTime=document.getElementById('liveTime'), liveView=document.getElementById('liveView'),
      livePreview=document.getElementById('livePreview'), lvFileName=document.getElementById('lvFileName'),
      lvTime2=document.getElementById('lvTime2');
const LIVE_META='https://raw.githubusercontent.com/xioahu1232/img-hosting/main/canvas/live/_meta.json';
const LIVE_CHANNELS=[
  'https://xioahu1232.github.io/img-hosting/canvas/live',
  'https://cdn.jsdelivr.net/gh/xioahu1232/img-hosting@main/canvas/live',
  'https://raw.githubusercontent.com/xioahu1232/img-hosting/main/canvas/live'
];
let liveTimer=null,liveFile='',liveExt='md',lastRendered='',typingTimer=null;
async function fetchLiveFile(name){
  const t=Date.now();
  let lastErr=null;
  for(const base of LIVE_CHANNELS){
    try{
      const r=await fetch(base+'/'+name+'?t='+t,{cache:'no-store'});
      if(r.ok)return await r.text();
      lastErr=new Error('HTTP '+r.status+' @ '+base);
    }catch(e){lastErr=e}
  }
  throw lastErr||new Error('所有通道不可达');
}
async function fetchMeta(){return JSON.parse(await fetchLiveFile('_meta.json'))}
function renderLive(content){
  if(liveExt==='md'){livePreview.innerHTML=mdToHtml(content)}
  else{livePreview.innerHTML='<pre class="coderaw">'+esc(content)+'</pre>'}
}
function handleLiveContent(content){
  if(content===lastRendered)return;
  if(content.length>lastRendered.length && content.slice(0,lastRendered.length)===lastRendered){
    // 追加模式 → 打字机逐字显示新增部分（观感=AI正在打字）
    const added=content.slice(lastRendered.length);
    let i=0;
    clearInterval(typingTimer);
    typingTimer=setInterval(()=>{
      i+=2; // 每次显示2个字符
      renderLive(lastRendered+added.slice(0,i));
      if(i>=added.length){
        clearInterval(typingTimer);
        lastRendered=content;
      }
    },18);
  }else{
    // 改写模式 → 整体重渲染
    clearInterval(typingTimer);
    renderLive(content);
    lastRendered=content;
  }
}
async function liveTick(){
  try{
    const meta=await fetchMeta();
    if(!meta.live){liveSetState(false,'直播已结束');return}
    const ext=(meta.file||'live.md').split('.').pop()||'md';
    const fname='live.'+ext;
    if(fname!==liveFile){liveFile=fname;liveExt=ext;lvFileName.textContent=meta.file||fname;lastRendered=''}
    const content=await fetchLiveFile(fname);
    handleLiveContent(content);
    const t=meta.updated?new Date(meta.updated):new Date();
    const ts=t.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    liveTime.textContent=ts;lvTime2.textContent='更新 '+ts;
    liveInfo.textContent='直播中：'+((meta.file||fname)+' · '+content.length+' 字节');
  }catch(e){liveTime.textContent='连接中…'}
}
function liveSetState(on,msg){
  if(on){liveBar.classList.add('show');liveInfo.textContent=msg||'直播中…'}
  else{liveBar.classList.remove('show');liveView.classList.remove('show');clearInterval(liveTimer);liveTimer=null;liveFile=''}
}
document.getElementById('btnLiveOpen').onclick=()=>liveView.classList.add('show');
document.getElementById('btnLiveMin').onclick=()=>liveView.classList.remove('show');
const stopLive=()=>{liveSetState(false,'');clearInterval(typingTimer);showToast('已退出直播')};
document.getElementById('btnLiveClose').onclick=stopLive;
document.getElementById('btnLiveQuit').onclick=stopLive;
/* 启动时探测一次直播状态 */
setTimeout(async()=>{
  try{const meta=await fetchMeta();if(meta.live){liveSetState(true);liveTick();liveTimer=setInterval(liveTick,2500)}}catch(e){}
},800);


const exportMenu=document.getElementById('exportMenu');
function downloadBlob(data,mime,name){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);showToast('已导出 '+name);
}
document.getElementById('btnExport').onclick=()=>exportMenu.classList.add('show');
document.getElementById('cancelExport').onclick=()=>exportMenu.classList.remove('show');
exportMenu.querySelectorAll('.mi[data-fmt]').forEach(btn=>btn.onclick=()=>{
  exportMenu.classList.remove('show');const fmt=btn.dataset.fmt,name=fname.value.replace(/\.(md|docx|html)$/i,'')||'untitled';
  if(fmt==='md'){downloadBlob(ed.value,'text/markdown',name+'.md')}
  else if(fmt==='html'){const full=`<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(name)}</title><style>body{max-width:720px;margin:0 auto;padding:16px;font-family:-apple-system,'PingFang SC',sans-serif;line-height:1.7}pre{background:#f5f5f5;padding:10px;border-radius:8px;overflow:auto}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:5px 9px}blockquote{border-left:3px solid #888;margin:0;padding:2px 12px;color:#444}img{max-width:100%}</style></head><body>${mdToHtml(ed.value)}</body></html>`;downloadBlob(full,'text/html',name+'.html')}
  else if(fmt==='docx'){try{downloadBlob(mdToDocx(ed.value),'application/vnd.openxmlformats-officedocument.wordprocessingml.document',name+'.docx')}catch(e){showToast('DOCX 生成失败: '+e.message)}}
  else if(fmt==='sync'){
    const block='<!--CANVAS-SYNC-BEGIN-->\nname: '+fname.value+'\nupdated: '+new Date().toISOString()+'\n<!--CANVAS-SYNC-BODY-->\n'+ed.value+'\n<!--CANVAS-SYNC-END-->';
    const doCopy=()=>{navigator.clipboard.writeText(block).then(()=>showToast('同步块已复制，去聊天粘贴')).catch(()=>{const ta=document.createElement('textarea');ta.value=block;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast('同步块已复制，去聊天粘贴')})};
    doCopy();
  }
  else if(fmt==='pdf'){render();document.querySelector('[data-pane=prev]').classList.add('show');document.querySelector('[data-pane=edit]').classList.remove('show');setTimeout(()=>window.print(),120)}
});
document.getElementById('btnCopy').onclick=async()=>{try{await navigator.clipboard.writeText(ed.value);showToast('已复制全文')}catch(e){ed.select();document.execCommand('copy');showToast('已复制')}};
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveSnap()}});
window.addEventListener('beforeunload',()=>{if(currentDoc){localStorage.setItem(LSKEY,ed.value);localStorage.setItem(LSNAME,fname.value)}});

/* 启动：安全迁移 P1 草稿到 IndexedDB */
(async function init(){
  try{
    if(!('indexedDB' in window))throw new Error('浏览器不支持 IndexedDB');
    db=await openDb();await migrateLegacy();
    const wanted=localStorage.getItem(CURRENT_KEY);let doc=wanted&&await getDoc(wanted);
    if(!doc){const all=await getAllDocs();doc=all[0]}
    if(!doc)doc=await createDocument('untitled.md',defaultContent());
    applyDoc(doc);await renderDocList();
  }catch(e){
    // 极少数旧浏览器的保底模式：仍能编辑和导出，但不提供文档库。
    fname.value=localStorage.getItem(LSNAME)||'untitled.md';ed.value=localStorage.getItem(LSKEY)||defaultContent();render();
    document.getElementById('btnLibrary').style.display='none';showToast('文档库不可用：'+e.message);
  }
})();
</script>
